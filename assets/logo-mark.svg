<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="t">
  <title id="t">Agentarium3D</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1226"/><stop offset="1" stop-color="#14245A"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FA0FF"/><stop offset="1" stop-color="#3FD0A8"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3D86"/><stop offset="1" stop-color="#16224F"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg)"/>
  <!-- the floor inside the glass -->
  <path d="M60 62 98 84 60 106 22 84Z" fill="url(#floor)"/>
  <!-- work passing between three agents -->
  <path d="M43 84 60 93 77 84" fill="none" stroke="#C9D6FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 5"/>
  <g>
    <ellipse cx="43" cy="86" rx="7" ry="3.4" fill="#0B1226" opacity=".55"/>
    <circle cx="43" cy="79" r="6" fill="#7F8CFF"/>
    <ellipse cx="60" cy="95" rx="7" ry="3.4" fill="#0B1226" opacity=".55"/>
    <circle cx="60" cy="88" r="6" fill="#F5A623"/>
    <ellipse cx="77" cy="86" rx="7" ry="3.4" fill="#0B1226" opacity=".55"/>
    <circle cx="77" cy="79" r="6" fill="#3FD0A8"/>
  </g>
  <!-- the glass enclosure -->
  <path d="M60 14 98 36 98 84 60 106 22 84 22 36Z" fill="#8FA0FF" fill-opacity=".07" stroke="url(#glass)" stroke-width="3.2" stroke-linejoin="round"/>
  <path d="M22 36 60 58 98 36M60 58V106" fill="none" stroke="url(#glass)" stroke-width="2" stroke-linejoin="round" stroke-opacity=".7"/>
  <path d="M60 14 98 36 60 58 22 36Z" fill="#FFFFFF" fill-opacity=".06"/>
</svg>
